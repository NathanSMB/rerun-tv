name: CI

# PRs, plus main after a merge. A PR run tests the branch head rather than its
# merge with main (see the checkout step), so two individually-green PRs can
# still merge into a broken main — the push run is what catches that. It costs
# one extra run per merge and is the only thing watching the branch everyone
# builds on.
on:
    pull_request:
    push:
        branches: [main]

# A second push to the same branch makes the first run pointless; cancel it.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        # `contents: write` exists solely for the badge commit below, and
        # `statuses: write` solely to carry this job's own result onto it. Fork
        # PRs get a read-only token regardless, which is why both of the steps
        # that use them skip forks.
        permissions:
            contents: write
            statuses: write
        env:
            # Several suites gate themselves on a real ffmpeg and skip silently
            # without one. This makes that skip a hard failure here, so a broken
            # ffmpeg install can never quietly turn the suite green.
            RERUN_REQUIRE_FFMPEG: "1"
        steps:
            # Check out the PR's head branch rather than the default detached
            # merge commit, so the badge step below has a branch to commit onto.
            # The tradeoff is that PR runs test the head commit, not its merge
            # with main.
            # On a push run both of these are empty, which checks out the
            # pushed commit — exactly what we want.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            # The stream, loudness, MSE and integration suites mux their fixtures
            # with a real ffmpeg (`lavfi`) and assert against the bytes it emits.
            # ~20s per run, uncached. A caching action would shave most of it off,
            # but every third-party action is supply-chain surface on a repo that
            # holds a `contents: write` token — not a trade worth making here.
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg

            # `postinstall` runs `electron-builder install-app-deps`, which only
            # rebuilds native deps against Electron's ABI — no Electron process is
            # launched, so this needs no display.
            - run: npm ci

            - run: npm run lint

            - run: npm run typecheck

            # `test:coverage` first runs `rebuild:node`, putting the native
            # binding back on the Node ABI that `install-app-deps` moved to
            # Electron's. Vitest runs in Node, so that rebuild is required. It
            # also deletes @electron/rebuild's `.forge-meta` marker, which still
            # claims Electron's ABI and would otherwise make a later packaging
            # run skip its rebuild and ship the Node binary — how the 0.1.0
            # AppImage shipped broken.
            # Coverage thresholds live in vitest.config.ts: below 70% this step
            # goes red, which is what blocks the merge.
            - run: npm run test:coverage

            # Typecheck is not a build: it never runs Rollup, so it cannot catch a
            # renderer import that Vitest's esbuild resolves and the real bundler
            # does not, or a React Compiler plugin incompatibility. This is the
            # class of breakage an outside PR causes, and nothing else here saw it.
            # (`npm run build` re-runs typecheck; the duplicate is a few seconds.)
            - run: npm run build

            # Surface the numbers on the PR itself (checks tab → job summary).
            - name: Report coverage in the job summary
              run: node scripts/coverage-badge.mjs --summary >> "$GITHUB_STEP_SUMMARY"

            # Write the new number into the README badge and commit it onto the
            # PR branch, so the badge lands in the same review as the code that
            # moved it and main is always correct the moment a PR merges.
            #
            # Skipped for fork PRs, whose token cannot push. Pushes made with
            # GITHUB_TOKEN do not trigger workflows, so this cannot loop.
            #
            # That same property is why the step has to report a status for
            # itself afterwards. The badge commit becomes the PR head, and no run
            # will ever happen on it — not by the token rule, not with `[skip ci]`
            # on it — so the `check` context main's branch protection requires
            # would never report there and the PR would sit on "Expected —
            # waiting for status to be reported" forever, with no named check to
            # click into. Carrying the result forward is honest: this job is that
            # check, and the only difference between the two commits is one
            # string in the README.
            - name: Update coverage badge
              if: >-
                  github.event_name == 'pull_request' &&
                  github.event.pull_request.head.repo.full_name == github.repository
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  node scripts/coverage-badge.mjs --write
                  if git diff --quiet -- README.md; then
                      echo "Coverage badge already current; nothing to commit."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git commit -q -m "Update coverage badge [skip ci]"
                  # A non-fast-forward here means the contributor pushed while we
                  # were running; their push will produce a run that writes the
                  # badge again. Not worth failing an otherwise green job over —
                  # and the status below must not be written either, since the
                  # head is then a commit this job never saw.
                  if ! git push -q origin "HEAD:${{ github.event.pull_request.head.ref }}"; then
                      echo "Branch moved on; the badge will update on the next run"
                      exit 0
                  fi
                  gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
                      -f state=success \
                      -f context=check \
                      -f target_url="$RUN_URL" \
                      -f description="Passed on the commit this badge update sits on" >/dev/null
