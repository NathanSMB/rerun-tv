name: Release

# Releases are a deliberate act, not a side effect of merging. Pushing a
# `v*.*.*` tag is the trigger, which also means the tag is an immutable record
# of exactly what shipped. Cut one with:
#
#     npm version patch|minor|major && git push --follow-tags
#
# `npm version` bumps package.json and creates the matching tag in one commit,
# which is what keeps the tag and the version in step (see the guard below).
on:
    push:
        tags:
            - "v*.*.*"

# Two tags pushed close together would otherwise race to publish. Unlike ci.yml
# this does not cancel in progress: a half-uploaded release is worse than a
# slow one.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        # One job per platform; each builds and uploads only its own targets
        # (Linux AppImage, macOS dmg+zip, Windows NSIS installer), so the jobs
        # never touch each other's artifacts. electron-builder's publisher
        # creates the release if it does not exist yet and otherwise attaches
        # to it, so whichever job finishes first wins that race harmlessly.
        strategy:
            # A macOS packaging failure should not cancel a Linux upload that
            # is already half done — let each platform finish or fail alone.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        # electron-builder's GitHub publisher creates the release and uploads
        # the artifacts with this token. Nothing else here writes to the repo.
        permissions:
            contents: write
        defaults:
            run:
                # The tag-check step and npm scripts below are written for a
                # POSIX shell; without this the Windows runner would hand them
                # to PowerShell.
                shell: bash
        env:
            # Same as ci.yml: turn a missing ffmpeg into a hard failure rather
            # than letting the suites that need it skip themselves green.
            RERUN_REQUIRE_FFMPEG: "1"
        steps:
            # A tag push checks out the tagged commit, which is what we want to
            # build. No `ref` override here, unlike ci.yml.
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            # electron-builder names the artifact from package.json's version, so
            # a tag that disagrees with it would publish `v0.2.0` containing a
            # 0.1.0 build. Tags do not go through PR review; this is the only
            # thing standing between a typo and a mislabelled release.
            - name: Check the tag matches package.json
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg." >&2
                      echo "Use \`npm version\` to bump and tag together." >&2
                      exit 1
                  fi
                  echo "Releasing $pkg"

            # The test fixtures are muxed with a real ffmpeg. Same reasoning as
            # ci.yml for using each OS's package manager rather than a caching
            # action: every third-party action is supply-chain surface on a job
            # holding a `contents: write` token.
            - name: Install ffmpeg (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y ffmpeg

            - name: Install ffmpeg (macOS)
              if: runner.os == 'macOS'
              run: brew install ffmpeg

            - name: Install ffmpeg (Windows)
              if: runner.os == 'Windows'
              run: choco install ffmpeg -y --no-progress

            - run: npm ci

            # A tag can point at any commit, including one that never went
            # through PR CI. Re-running the checks here is a few minutes on a
            # workflow that runs a handful of times a year.
            - run: npm run lint

            - run: npm run typecheck

            # `npm test` rather than `test:coverage`: the 70% floor is a merge
            # gate, and blocking a release on a coverage number for code that
            # already passed that gate on main buys nothing.
            #
            # This step flips better-sqlite3 to Node's ABI so Vitest can load it,
            # which is what broke the 0.1.0 AppImage: @electron/rebuild then read
            # its own stale `.forge-meta` marker, concluded the module was
            # already built for Electron, skipped the rebuild and packaged the
            # Node binary. `rebuild:node` now clears that marker, and the
            # `afterPack` hook below fails the build if one slips through anyway.
            - run: npm test

            # Builds (which re-runs typecheck, a few seconds) and hands this
            # platform's targets plus its update-metadata file (latest-linux.yml,
            # latest-mac.yml or latest.yml) to electron-builder's GitHub
            # publisher. Those metadata files are what electron-updater would
            # read if in-app updates get wired up later — free to publish now,
            # awkward to backfill.
            #
            # scripts/verify-native-abi.mjs runs as electron-builder's
            # `afterPack`, dlopening every packed addon with the packed Electron
            # binary. It is the only step here that exercises Electron's ABI, and
            # it runs before the final package is assembled, so a mismatch fails
            # the job instead of publishing an app that dies on launch.
            - name: Build and publish to GitHub Releases
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm run release
